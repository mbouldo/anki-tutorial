<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Timestamp Tool</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

video {
    width: 100%;
    background: black;
    margin-top: 15px;
}

#currentTime {
    font-size: 28px;
    font-family: monospace;
    margin: 15px 0;
}

button {
    cursor: pointer;
    padding: 8px 14px;
}

.timestamp {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 6px 0;
    padding: 6px;
    border: 1px solid #ccc;
}

.timestamp span {
    font-family: monospace;
    font-size: 18px;
}
</style>
</head>

<body>

<h2>Video Timestamp Tool</h2>

<input type="file" id="videoFile" accept="video/*">

<video id="video" controls></video>

<div id="currentTime">00:00.000</div>

<button id="markBtn">Mark Timestamp</button>

<hr>
<button id="extractBtn">Extract</button>

<pre id="output"></pre>
<div id="timestamps"></div>

<script>
const fileInput = document.getElementById("videoFile");
const video = document.getElementById("video");
const currentTime = document.getElementById("currentTime");
const markBtn = document.getElementById("markBtn");
const timestamps = document.getElementById("timestamps");

fileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    video.src = URL.createObjectURL(file);
    video.load();
});

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    const ms = Math.floor((seconds % 1) * 1000);

    return `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}.${String(ms).padStart(3,"0")}`;
}

function updateClock() {
    currentTime.textContent = formatTime(video.currentTime);
    requestAnimationFrame(updateClock);
}

requestAnimationFrame(updateClock);

markBtn.addEventListener("click", () => {
    const row = document.createElement("div");
    row.className = "timestamp";

    const time = document.createElement("span");
    time.className = "time";
    time.textContent = formatTime(video.currentTime);

    const textarea = document.createElement("textarea");
    textarea.rows = 2;
    textarea.cols = 40;
    textarea.placeholder = "Timestamp text...";

    const del = document.createElement("button");
    del.textContent = "Delete";
    del.onclick = () => row.remove();

    row.appendChild(time);
    row.appendChild(textarea);
    row.appendChild(del);

    timestamps.appendChild(row);
});
const extractBtn = document.getElementById("extractBtn");
const output = document.getElementById("output");

extractBtn.addEventListener("click", () => {
    const id = prompt("ID:", "enable-sync") || "";
    const name = prompt("Name:", "Enable Syncing") || "";
    const route = prompt("Route:", "setup-sync") || "";
    const body = prompt("Markdown file:", "sync.md") || "";
    const video = prompt("Video filename:", "sync.mp4") || "";

    const obj = {
        id,
        name,
        route,
        sidebarTitle: name,
        breadcrumb: name,
        bodyPath: `markdown/${body}`,
        videoPath: `/videos/${video}`,
        stops: []
    };

    document.querySelectorAll(".timestamp").forEach(row => {
        const t = row.querySelector(".time").textContent;
        const text = row.querySelector("textarea").value.trim();

        const [m, rest] = t.split(":");
        const seconds = Number(m) * 60 + Number(rest);

        obj.stops.push({
            t: Number(seconds.toFixed(2)),
            text
        });
    });

    output.textContent = JSON.stringify(obj, null, 2);
    console.log(obj);
});
</script>

</body>
</html>
