<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{CSSPATH}}?v={{CACHE_VER}}" as="style">
  <title>{{PAGE_TITLE}}</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{SERVER_DIR}}/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="{{SERVER_DIR}}/favicon.svg" />
  <link rel="shortcut icon" href="{{SERVER_DIR}}/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{SERVER_DIR}}/apple-touch-icon.png" />
  <link rel="manifest" href="{{SERVER_DIR}}/site.webmanifest" />

  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="author" content="Martin Bouldo">
  <meta property="article:published_time" content="2026-07-06T12:00:00-04:00">
  <meta property="article:author" content="Martin Bouldo">
  <meta name="theme-color" content="#ffffff">

  <link rel="canonical" href="{{CANONICAL_URL}}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">

  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Anki Tutorial">

  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:site_name" content="Anki Tutorial">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{PAGE_TITLE}}">
  <meta name="twitter:description" content="{{META_DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">

  <meta name="robots" content="index, follow">

  <meta property="og:locale" content="en_US">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "name": "Anki Tutorial",
        "url": "https://mbouldo.com/anki-tutorial/"
      },
      {
        "@type": "TechArticle",
        "headline": "{{PAGE_TITLE}}",
        "description": "{{META_DESCRIPTION}}",
        "author": {
          "@type": "Person",
          "name": "Martin Bouldo"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Anki Tutorial"
        },
        "mainEntityOfPage": "{{CANONICAL_URL}}",
        "image": "{{OG_IMAGE}}",
        "datePublished": "2026-07-06",
        "dateModified": "2026-07-06"
      }
    ]
  }
</script>
</head>

<body class="bg-zinc-50 text-zinc-900">

  <header class="sticky top-0 z-50 border-b border-zinc-200 bg-white/90 backdrop-blur">
    <div class="relative mx-auto flex max-w-7xl items-center justify-between px-8 py-5">
      <h1 class="text-2xl font-semibold tracking-tight">
        <a href="https://mbouldo.com" class="text-xl font-normal text-gray-600 hover:text-gray-800">
          mbouldo.com /
        </a>
        <a href="{{SERVER_DIR}}">Anki Tutorial</a>
      </h1>

      <div class="flex items-center gap-3">
        <a href="https://github.com/mbouldo/anki-tutorial" target="_blank" rel="noopener noreferrer"
          class="hidden lg:flex items-center gap-2 text-gray-600 hover:text-black transition-colors"
          aria-label="GitHub repository">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-6 w-6 fill-current">
            <path
              d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 008 10.94c.58.1.79-.25.79-.56v-2.16c-3.25.71-3.94-1.39-3.94-1.39-.53-1.36-1.3-1.72-1.3-1.72-1.06-.73.08-.72.08-.72 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.73 1.27 3.4.97.11-.75.41-1.27.74-1.56-2.6-.3-5.34-1.3-5.34-5.77 0-1.27.45-2.31 1.2-3.12-.12-.3-.52-1.52.11-3.17 0 0 .98-.31 3.2 1.19a11.1 11.1 0 015.82 0c2.22-1.5 3.2-1.19 3.2-1.19.63 1.65.23 2.87.11 3.17.75.81 1.2 1.85 1.2 3.12 0 4.48-2.75 5.47-5.36 5.76.42.37.8 1.1.8 2.23v3.3c0 .31.21.67.8.56A11.5 11.5 0 0023.5 12C23.5 5.65 18.35.5 12 .5z" />
          </svg>
          <span class="text-sm">Source Code</span>
        </a>

        <button id="sidebarToggle" class="lg:hidden p-2 rounded  text-black cursor-pointer text-2xl leading-none">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>

        </button>
      </div>
    </div>
  </header>


  <div class="mx-auto flex lg:max-w-7xl">
    <!-- Sidebar -->
    {{SIDEBAR}}

    <!-- Content -->
    <main class="flex-1 min-w-0 px-2 md:px-2 lg:px-12 py-10">

      <div class="mx-auto ">

        <!-- Breadcrumb -->
        {{BREADCRUMB}}

        <!-- Video Player Wrapper -->
        <section id="playerWrap" class="aspect-video w-full overflow-hidden rounded-xl bg-black relative "
          {{HIDE_INDEX}}>

          <!-- progress bar segements-->
          <div id="progressBar" class="absolute top-2 left-1/2 -translate-x-1/2 flex gap-1 z-20"></div>

          <!-- step counter box (n/length) -->
          <div id="currentStepBox"
            class="absolute top-3 left-3 z-10 rounded-lg bg-black/60 text-white text-xs font-medium px-2.5 py-1.5 tabular-nums">
          </div>

          {{VIDEO_BLOCK}}

          <!-- caption -->
          <div id="caption" class="absolute bottom-0 left-0 right-0 px-4 py-3 text-white text-md
                                    bg-gray-900 
                                    opacity-0 translate-y-2 transition-all duration-300 ease-out">
          </div>

          <!-- prev -->
          <button id="prevBtn" aria-label="Previous step"
            class="absolute left-3 top-1/2 -translate-y-1/2 z-10 rounded-full bg-black/60 text-white ">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
          </button>

          <!-- next -->
          <button id="nextBtn" aria-label="Next step"
            class="absolute right-3 top-1/2 -translate-y-1/2 z-10 rounded-full bg-black/60 text-white ">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
          </button>

          <!-- fullscreen -->
          <button id="expandToFullScreenBtn" aria-label="Toggle fullscreen"
            class="absolute top-3 right-3 z-10 cursor-pointer
                                    rounded-lg bg-black/60 text-white p-2 hover:bg-black/80
                                    transition-all duration-200
                                    focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-offset-2 focus-visible:ring-offset-black">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
            </svg>
          </button>

        </section>

        <!-- Article -->
        <article class="mt-10 px-4 md:px-0 max-w-full overflow-x-hidden">
          {{ARTICLE}}
        </article>
      </div>

    </main>

  </div>
  <script>
    {{STOPS_ARRAY}}
  </script>
  <script src="{{JSPATH}}?v={{CACHE_VER}}"></script>
 
</body>

</html>
